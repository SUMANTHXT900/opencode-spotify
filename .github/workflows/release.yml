# Release to npm — TAG-TRIGGERED with OIDC trusted publishing + provenance.
#
# Push a version tag and this workflow publishes exactly what CI verified:
#   tag vX.Y.Z        -> stable release, npm dist-tag `latest`
#   tag vX.Y.Z-beta.N -> prerelease, npm dist-tag `beta`
#
#   validate: sparse-checkout plugin/package.json + the policy helper, run
#     `tag-release`: the tag must be v<strict-semver> (only stable or
#     -beta.N), must exactly equal plugin/package.json, and yields the
#     `version` / `dist_tag` job outputs.
#   verify: reusable ./.github/workflows/ci.yml with
#     retain_release_candidate=true. The single full verify-package gate
#     builds, asserts, installs and probes the tarball, then uploads ONE
#     candidate artifact (tgz + .sha256 + .integrity + proof.json). The
#     successful tag run as a whole is the authority for what is published;
#     there is no rebuild between verification and publication.
#   publish: downloads ONLY that candidate artifact, rechecks both digests
#     plus proof metadata (source SHA, run_id, repository, verifier),
#     performs a SINGLE `npm view opencode-spotify --json` read (fail closed
#     on duplicate version, dist-tag monotonicity preflight), publishes the
#     exact downloaded bytes with --provenance, verifies registry integrity
#     and the intended tag, then creates/updates the GitHub Release for the
#     tag with the verified assets attached (--prerelease for beta).
#
# Publish-job checkout discipline: the publish job mints the OIDC token, so
# it sparse-checks out only the reviewed policy helper (persist-credentials:
# false) and executes no other repo code. All ref/policy logic lives in that
# helper or in quoted shell reading workflow-mapped env vars.
#
# Rerun safety: the candidate is re-downloaded from THIS run and both
# digests plus proof metadata are rechecked immediately before publish, so
# a replaced artifact fails closed instead of publishing unknown bytes.
#
# Registry reads pin --registry=https://registry.npmjs.org so a
# mirror/redirect baseline can never substitute a different view of the
# package. A strict-SemVer dist-tag preflight additionally refuses to move
# the selected tag backwards (prerelease precedence per semver.org item 11);
# a missing tag (first use) allows. The installer itself never downgrades,
# so this preflight is a second, registry-side guard.
#
# Activation prerequisites (see docs/MAINTAINERS.md):
#   1. The npm package `opencode-spotify` exists and lists this repository
#      as a trusted publisher (npm Package Settings -> Trusted Publisher).
#   2. A GitHub environment named `npm-release` is configured with required
#      reviewers. No NPM_TOKEN is used anywhere here.
#
# Every third-party action below is pinned to a full commit SHA (comment shows
# the version tag it corresponds to). No step touches Spotify/Spicetify or
# writes any OpenCode configuration.

name: Release to npm (tag)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Derive release version and dist-tag from tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag-release.outputs.version }}
      dist_tag: ${{ steps.tag-release.outputs.dist_tag }}
    steps:
      - name: Check out tag source (sparse)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            plugin/package.json
            .github/scripts/validate-release-policy.mjs

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.12.0'

      - name: Derive version and dist-tag from the pushed tag
        id: tag-release
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG_NAME: ${{ github.ref_name }}
        run: node .github/scripts/validate-release-policy.mjs tag-release

  verify:
    name: Verify release candidate (reusable CI)
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      retain_release_candidate: true
    permissions:
      contents: read

  publish:
    name: Publish verified candidate to npm (OIDC)
    needs: [validate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Check out only the reviewed release helper (sparse)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: .github/scripts/validate-release-policy.mjs
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.12.0'

      - name: Require npm with OIDC trusted publishing support (fail closed, no upgrade)
        # Node 24.12.0 ships npm 11.6.2 (observed), which already qualifies.
        # A drifted older runner fails closed; no global upgrade is attempted
        # in the mint-token job.
        run: |
          set -euo pipefail
          CURRENT="$(npm --version)"
          echo "Runner npm version: $CURRENT (need >= 11.5.1)"
          if node -e "const p = process.argv[1].split('.').map(Number); process.exit(p[0] > 11 || (p[0] === 11 && (p[1] > 5 || (p[1] === 5 && p[2] >= 1))) ? 0 : 1)" "$CURRENT"; then
            echo "Runner npm qualifies."
          else
            echo "::error::Runner npm is too old for OIDC trusted publishing (>= 11.5.1 required). Failing closed; no upgrade attempted."
            exit 1
          fi

      - name: Download only the candidate from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: dist

      - name: Recheck candidate bytes, proof and source binding
        env:
          CANDIDATE_DIR: dist
          INPUT_VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          PREPARE_RUN_ID: ${{ github.run_id }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TGZ="dist/opencode-spotify-$INPUT_VERSION.tgz"
          if [ ! -f "$TGZ" ]; then echo "::error::Candidate tarball is missing: $TGZ."; exit 1; fi
          EXPECTED_SHA256="$(cut -d ' ' -f1 "$TGZ.sha256" | tr -d '\r\n')"
          EXPECTED_SHA512="$(tr -d ' \r\n\t' < "$TGZ.integrity")"
          export EXPECTED_SHA256 EXPECTED_SHA512
          node .github/scripts/validate-release-policy.mjs recheck

      - name: Read registry metadata once and preflight dist-tag monotonicity
        # A SINGLE registry read: fail closed when the version already exists,
        # then run the strict-SemVer monotonicity preflight for the tag this
        # release will move. A failed or unparseable read fails closed.
        env:
          PACKAGE_NAME: opencode-spotify
          NPM_REGISTRY: https://registry.npmjs.org
          INPUT_VERSION: ${{ needs.validate.outputs.version }}
          INPUT_DIST_TAG: ${{ needs.validate.outputs.dist_tag }}
        run: |
          set -euo pipefail
          META="$(npm view "$PACKAGE_NAME" --json --registry="$NPM_REGISTRY" 2>/dev/null)" || { echo "::error::Could not read package metadata from the registry; failing closed."; exit 1; }
          if printf '%s' "$META" | jq -e --arg v "$INPUT_VERSION" '.versions | index($v)' >/dev/null; then
            echo "::error::opencode-spotify@$INPUT_VERSION is already published. Push a new version tag instead."
            exit 1
          fi
          CURRENT_TAG="$(printf '%s' "$META" | jq -r --arg tag "$INPUT_DIST_TAG" '.["dist-tags"][$tag] // empty')"
          SAFE_TAG="$(printf '%s' "$INPUT_DIST_TAG" | tr -d '\r\n' | head -c 50)"
          SAFE_CURRENT="$(printf '%s' "$CURRENT_TAG" | tr -d '\r\n' | head -c 100)"
          echo "Selected dist-tag '$SAFE_TAG' currently points at: '${SAFE_CURRENT:-<missing>}'"
          CURRENT_TAG="$CURRENT_TAG" node .github/scripts/validate-release-policy.mjs tag-preflight

      - name: Publish the exact verified tarball
        env:
          INPUT_VERSION: ${{ needs.validate.outputs.version }}
          INPUT_DIST_TAG: ${{ needs.validate.outputs.dist_tag }}
        # OIDC trusted publishing: no NPM_TOKEN. Requires npm >= 11.5.1
        # (provided by setup-node's bundled npm) and a trusted publisher
        # configured on the npm package. npm authenticates via the
        # id-token permission granted to this job only.
        run: |
          set -euo pipefail
          TGZ="dist/opencode-spotify-$INPUT_VERSION.tgz"
          if [ ! -f "$TGZ" ]; then echo "::error::Candidate tarball is missing."; exit 1; fi
          npm publish "./dist/opencode-spotify-$INPUT_VERSION.tgz" --tag "$INPUT_DIST_TAG" --access public --provenance --registry=https://registry.npmjs.org --ignore-scripts

      - name: Verify registry integrity and intended tag
        env:
          PACKAGE_NAME: opencode-spotify
          NPM_REGISTRY: https://registry.npmjs.org
          INPUT_VERSION: ${{ needs.validate.outputs.version }}
          INPUT_DIST_TAG: ${{ needs.validate.outputs.dist_tag }}
        run: |
          set -euo pipefail
          TGZ="dist/opencode-spotify-$INPUT_VERSION.tgz"
          EXPECTED_SHA512="$(tr -d ' \r\n\t' < "$TGZ.integrity")"
          REG_INTEGRITY="$(npm view "$PACKAGE_NAME@$INPUT_VERSION" dist.integrity --json --registry="$NPM_REGISTRY" 2>/dev/null | jq -r '.')"
          if [ "$REG_INTEGRITY" != "$EXPECTED_SHA512" ]; then echo "::error::Registry integrity does not match the published candidate."; exit 1; fi
          REG_TAG="$(npm view "$PACKAGE_NAME" "dist-tags.$INPUT_DIST_TAG" --registry="$NPM_REGISTRY" 2>/dev/null | tail -n 1 | tr -d ' \r\n')"
          if [ "$REG_TAG" != "$INPUT_VERSION" ]; then echo "::error::Registry dist-tag does not point at the published version."; exit 1; fi
          echo "Registry verification passed."

      - name: Create or update GitHub Release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ needs.validate.outputs.version }}
          INPUT_DIST_TAG: ${{ needs.validate.outputs.dist_tag }}
        run: |
          set -euo pipefail
          TAG="v$INPUT_VERSION"
          TGZ="dist/opencode-spotify-$INPUT_VERSION.tgz"
          NOTES="opencode-spotify $INPUT_VERSION (npm dist-tag: $INPUT_DIST_TAG). Verified tarball plus SHA-256/SHA-512 digests attached; published with OIDC provenance."
          if [ "$INPUT_DIST_TAG" = "beta" ]; then PRERELEASE="--prerelease"; else PRERELEASE=""; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TGZ" "$TGZ.sha256" "$TGZ.integrity" --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" "$TGZ" "$TGZ.sha256" "$TGZ.integrity" --title "$TAG" --notes "$NOTES" $PRERELEASE
          fi
