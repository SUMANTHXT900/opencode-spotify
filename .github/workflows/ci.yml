name: CI

on:
  push:
    branches: [main]
    paths:
      - "plugin/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "plugin/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded branch runs; never cancel main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fast-checks:
    name: Fast checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
        working-directory: plugin
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Typecheck
        run: npm run typecheck

      - name: Check bridge JavaScript syntax
        run: node --check spicetify/opencode-spotify-bridge.js

      - name: Inspect the npm package without publishing
        run: npm pack --dry-run --ignore-scripts

      # Report all advisories. The documented baseline has moderate
      # findings without a compatible fix; high and critical findings fail CI.
      - name: Audit dependencies (fail on high or critical)
        run: npm audit --audit-level=high

  unit-windows:
    name: Unit tests (Windows, fast subset)
    runs-on: windows-2025
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh
        working-directory: plugin
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit

      # Slow packaging fixtures (package-smoke, verify-artifact) and the
      # VT emission harness run once in the pack/render jobs below.
      - name: Run fast unit tests (excludes packaging + VT)
        run: npm run test:fast

  render-windows:
    name: Rendering checks (Windows + Bun)
    runs-on: windows-2025
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh
        working-directory: plugin
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Cache Bun modules
        uses: actions/cache@0400d5f644c24c96b7ad0d632c5ea2d011659ac0c8 # v4.2.4
        with:
          path: ~/.bun/install/cache
          key: bun-1.3.14-${{ runner.os }}-${{ hashFiles('plugin/package-lock.json') }}
          restore-keys: |
            bun-1.3.14-${{ runner.os }}-

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Verify native rendering
        run: npm run test:render

      - name: Verify persistent VT transitions
        run: npm run test:vt

      - name: Verify artwork
        run: npm run test:artwork

  pack-windows:
    name: Package verification (Windows, once)
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
        working-directory: plugin
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit

      # Single full verification (builds, packs, exact file list, isolated
      # install, bin --version/--help, packed provisioner smoke). The script
      # builds dist/ itself immediately before packing; a separate build step
      # would compile the same sources twice. No artifact upload.
      - name: Verify packed package
        run: node scripts/verify-package.mjs
