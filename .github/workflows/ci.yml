name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on Windows
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: plugin
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Typecheck
        run: npm run typecheck

      - name: Run the full test suite
        run: npm test

      - name: Verify native rendering
        run: npm run test:render

      - name: Verify persistent VT transitions
        run: npm run test:vt

      - name: Verify artwork
        run: npm run test:artwork

      - name: Check bridge JavaScript syntax
        run: node --check spicetify/opencode-spotify-bridge.js

      - name: Inspect the npm package without publishing
        run: npm pack --dry-run --ignore-scripts

      # Report all advisories. The documented V0.5.7 baseline has moderate
      # findings without a compatible fix; high and critical findings fail CI.
      - name: Audit dependencies (fail on high or critical)
        run: npm audit --audit-level=high
