name: CI

# Windows-only verification for the V0.6.0 prerelease line. No Linux or macOS
# jobs: the installer, Spicetify handling, rendering assertions and the packed
# provisioner smoke are Windows-specific by design.

on:
  push:
    branches: [main]
    paths:
      - "plugin/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "plugin/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded branch runs; never cancel main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks-unit:
    name: Static checks and unit tests (Windows)
    runs-on: windows-2025
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh
        working-directory: plugin
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Typecheck
        run: npm run typecheck

      - name: Check bridge JavaScript syntax
        run: node --check spicetify/opencode-spotify-bridge.js

      - name: Inspect the npm package without publishing
        run: npm pack --dry-run --ignore-scripts

      # Report all advisories. The documented baseline has moderate
      # findings without a compatible fix; high and critical findings fail CI.
      - name: Audit dependencies (fail on high or critical)
        run: npm audit --audit-level=high

      # Fast subset only. Packaging fixtures (package-smoke, verify-artifact)
      # and Bun-native suites (artwork, layout-render, VT) run in render-pack.
      - name: Run fast unit tests (excludes packaging, VT and Bun-native suites)
        run: npm run test:fast

  render-pack:
    name: Rendering and package verification (Windows + Bun)
    runs-on: windows-2025
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
        working-directory: plugin
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Cache Bun modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-1.3.14-${{ runner.os }}-${{ hashFiles('plugin/package-lock.json') }}
          restore-keys: |
            bun-1.3.14-${{ runner.os }}-

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Verify native rendering
        run: npm run test:render

      - name: Verify persistent VT transitions
        run: npm run test:vt

      - name: Verify artwork
        run: npm run test:artwork

      # Bun-native unit suites: they shell out to `bun`, so they live with the
      # Bun toolchain instead of the Bun-less unit job.
      - name: Run Bun-native unit suites
        run: npm run test:bun

      # Single full verification: builds dist/, packs, asserts the exact file
      # list, installs into an isolated prefix, runs bin --version/--help and
      # the packed provisioner smoke. No artifact upload; release.yml retains
      # the digest-verified tarball at publish time.
      - name: Verify packed package
        run: node scripts/verify-package.mjs
