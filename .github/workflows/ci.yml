name: CI

# Windows-only verification for the V0.6.0 prerelease line. No Linux or macOS
# jobs: the installer, Spicetify handling, rendering assertions and the packed
# provisioner smoke are Windows-specific by design.
#
# No workflow-level path filtering: both check names below are always emitted
# for every push/PR so required checks never go silent. Costly runners are
# still exactly the two windows-2025 jobs below.
#
# Reusable: release.yml prepare calls this workflow with
# retain_release_candidate=true. The single full verify-package run then
# retains the exact tarball plus sidecars and a machine-readable proof.json
# (source SHA, version, digests, verifier identity) and uploads all of them
# as ONE candidate artifact. The successful prepare run as a whole is the
# authority; proof.json is evidence, not trust on its own.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      retain_release_candidate:
        description: "Retain the verified tarball + sidecars + proof.json as the single release-candidate artifact"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Include the workflow name so a reusable call from release.yml never shares
# (or cancels) a standalone CI run. Main is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks-unit:
    name: Static checks and unit tests (Windows)
    runs-on: windows-2025
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh
        working-directory: plugin
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify required helper scripts exist (fail fast on partial checkout)
        run: |
          $missing = @(
            'plugin/scripts/verify-package.mjs',
            'plugin/scripts/verify-package-lib.mjs',
            'plugin/scripts/check-test-accounting.mjs',
            'plugin/scripts/compatibility-candidates.mjs',
            '.github/scripts/validate-release-policy.mjs',
            '.github/scripts/release-policy.test.mjs'
          ) | Where-Object { -not (Test-Path (Join-Path $env:GITHUB_WORKSPACE $_)) }
          if ($missing) { Write-Error "missing required helper(s): $($missing -join ', ')"; exit 1 }

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Cache actionlint binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/actionlint-1.7.12
          key: actionlint-win-x64-1.7.12

      - name: Install locked dependencies
        run: npm ci --prefer-offline --ignore-scripts --no-audit --no-fund

      # Sub-second static/policy checks in one step: fewer runner slots, same
      # gates (typecheck, bridge syntax, test accounting, release policy,
      # candidate selftest, actionlint with cache dir). $LASTEXITCODE is
      # checked after every command so no failure is masked.
      - name: Static and policy checks (typecheck, syntax, accounting, policy, actionlint)
        env:
          ACTIONLINT_CACHE_DIR: ${{ runner.temp }}/actionlint-1.7.12
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node --check spicetify/opencode-spotify-bridge.js
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node scripts/check-test-accounting.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node --test ../.github/scripts/release-policy.test.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node scripts/compatibility-candidates.mjs selftest
          if ($LASTEXITCODE -ne 0) { exit 1 }
          pwsh -NoProfile -File ../.github/scripts/actionlint.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Fast Node-only subset. The cheap packaging-behavior suites
      # (package-smoke, verify-artifact) run here inside test:fast; the single
      # full verify-package gate runs in render-pack. Bun-native suites and VT
      # run in render-pack.
      - name: Run fast unit tests (Node-only; includes cheap packaging-behavior suites)
        run: npm run test:fast

  render-pack:
    name: Rendering and package verification (Windows + Bun)
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: plugin
    steps:
      - name: Add Defender exclusions (best effort, non-fatal)
        working-directory: ${{ github.workspace }}
        run: |
          try { Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP -ErrorAction SilentlyContinue } catch { }

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install locked dependencies
        run: npm ci --prefer-offline --ignore-scripts --no-audit --no-fund

      # test:bun already runs artwork.test.ts and layout-render.test.ts, which
      # spawn the same render-artwork.tsx / render-layout.tsx fixtures as
      # test:artwork / test:render. Running both shapes executes each native
      # suite twice. Combined with test:vt in one step; $LASTEXITCODE is
      # checked after each so no failure is masked.
      - name: Run Bun-native suites and verify persistent VT transitions
        run: |
          npm run test:bun
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npm run test:vt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Single full verification. Without retention (plain CI) it packs,
      # asserts, installs and probes, then discards temp state. With retention
      # (release prepare) it keeps the exact verified bytes for upload below.
      - name: Verify packed package
        if: ${{ inputs.retain_release_candidate != true }}
        run: node scripts/verify-package.mjs

      - name: Verify packed package and retain exact bytes
        if: ${{ inputs.retain_release_candidate == true }}
        env:
          KEEP_DIR: ${{ runner.temp }}/release-candidate
        run: node scripts/verify-package.mjs --keep-dir "$env:KEEP_DIR"

      - name: Write candidate proof (source SHA, version, digests, verifier)
        if: ${{ inputs.retain_release_candidate == true }}
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/release-candidate
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          REPOSITORY: ${{ github.repository }}
        run: node ../.github/scripts/validate-release-policy.mjs write-proof

      # ONE candidate archive: the exact tgz CI verified, both sidecars, and
      # the machine-readable proof. Downloaded by release.yml publish via gh
      # from the validated prepare run; never rebuilt after QA.
      - name: Upload release candidate (tgz + sidecars + proof)
        if: ${{ inputs.retain_release_candidate == true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-candidate
          if-no-files-found: error
          retention-days: 30
